name: Auto-close old Jira tasks

on:
  schedule:
    # Runs every Friday at 09:00 UTC
    - cron: "0 9 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 'true' to preview without closing"
        required: false
        default: "false"

jobs:
  close-old-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Close Jira tasks older than 2 days
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python close_old_jira_tasks.py
